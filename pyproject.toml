[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scarcity"
version = "1.0.0"
description = "SCARCITY core simulation, federation, and governance library."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Omega Makena" }]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11"
]
license-files = ["LICENSE"]

[project.optional-dependencies]
# Offline causal-inference pipeline (scarcity.causal / run_causal)
causal = [
  "dowhy>=0.11"
]
# JIT-accelerated engine modules (anomaly detection, forecasting handoff)
accel = [
  "numba>=0.59"
]
# Streaming, sharding, and async file replay
stream = [
  "aiofiles>=23.2",
  "websockets>=11.0",
  "scikit-learn>=1.3"
]
# Dashboard and API surface
dashboard = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "qrcode[pil]>=7.4"
]
# GPU telemetry, rendering, and heavy ops
gpu = [
  "torch>=2.1",
  "pytorch3d>=0.7",
  "pynvml>=11.0"
]
# System metrics and resource governance
governor = [
  "psutil>=5.9"
]
# Federation/Meta interface utilities
fmi = [
  "pyyaml>=6.0",
  "zstandard>=0.22"
]
# Secure federation transport
federation = [
  "cryptography>=42.0"
]
# Everything except dev — convenience meta-extra
all = [
  "dowhy>=0.11",
  "numba>=0.59",
  "aiofiles>=23.2",
  "websockets>=11.0",
  "scikit-learn>=1.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "qrcode[pil]>=7.4",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "zstandard>=0.22",
  "cryptography>=42.0"
]
# Test, lint, and type-check toolchain (used by CI)
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.23",
  "scipy>=1.11",
  "ruff>=0.4",
  "mypy>=1.9"
]

[project.urls]
Homepage = "https://github.com/Omega-Makena/KScarcity"
Repository = "https://github.com/Omega-Makena/KScarcity"

[tool.setuptools.package-data]
scarcity = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scarcity*"]
exclude = [
  "backend*",
  "ui*",
  "docs*",
  "documentation*",
  "scarcity-deep-dive*",
  "tests*"
]

[tool.pytest.ini_options]
# Scope collection to the scarcity package: the repo also contains unrelated
# subsystems (kshiked, e2e scripts) whose test modules require optional deps not
# in the scarcity install (pulse, playwright) and otherwise break bare `pytest`
# collection / CI. The scarcity framework's own suite lives under scarcity/.
testpaths = ["scarcity"]
asyncio_mode = "auto"
# Pin the fixture event-loop scope explicitly (pytest-asyncio otherwise warns
# that the unset default will change in a future release).
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
  # Third-party: dowhy 0.14 datasets.py calls np.vectorize(convert_to_binary),
  # which numpy 1.25+ flags for array->scalar coercion. Not our code; the durable
  # fix is a dowhy release that stops passing array-returning funcs to vectorize.
  "ignore:Conversion of an array with ndim > 0 to a scalar is deprecated:DeprecationWarning",
]
